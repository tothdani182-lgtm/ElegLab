<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trapezoid Dynamic Island</title>
    
    <style>
        /* ==========================================
           1. DIZÁJN BEÁLLÍTÁSOK ÉS VÁLTOZÓK
           ========================================== */
        :root {
            /* Itt tudod állítani a trapéz alsó sarkainak lekerekítését */
            --sarok-lekerekites: 18px; 
            
            /* A te egyedi színátmeneted: Királykékből sötétvörösbe */
            --island-gradient: linear-gradient(135deg, #4169E1, #8B0000);
            
            /* Elegáns, prémium betűtípus az iOS stílusában */
            --alap-betutipus: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background: transparent; /* Átlátszó háttér, hogy látszódjon a telefonod háttérképe */
            font-family: var(--alap-betutipus);
            color: white;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ==========================================
           2. A TRAPÉZ ISLAND ALAPJA
           ========================================== */
        .trapez-island {
            width: 340px;
            height: 38px;
            background: var(--island-gradient);
            margin-top: 0px; /* Közvetlenül a kijelző legtetejére tapad */
            padding: 0 18px;
            
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            box-sizing: border-box;

            /* Trapéz alakzat kivágása: a teteje teljes szélességű, az alja beljebb ugrik */
            clip-path: polygon(0% 0%, 100% 0%, 91% 100%, 9% 100%);
            
            /* Az alsó sarkok lekerekítése a változóból */
            border-bottom-left-radius: var(--sarok-lekerekites);
            border-bottom-right-radius: var(--sarok-lekerekites);
            
            /* Finom árnyék a prémium hatásért */
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.4);
            
            /* Sima animációs átmenet, ha változik a mérete */
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* ==========================================
           3. ELEMEK ELRENDEZÉSE ÉS TIPOGRÁFIA
           ========================================== */
        
        /* Bal oldal: Az óra */
        .island-left {
            display: flex;
            align-items: center;
            z-index: 2;
        }

        .time-display {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Középső rész: Ide jönnek majd a hívások és értesítések */
        .island-center {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            z-index: 2;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Jobb oldal: WiFi és Akkumulátor */
        .island-right {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .wifi-icon {
            font-size: 12px;
            opacity: 0.9;
        }

        /* Akkumulátor ikon, aminek a belsejébe van írva a százalék */
        .battery-container {
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 4px;
            padding: 1px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            min-width: 32px;
            height: 14px;
            box-sizing: border-box;
            position: relative;
        }

        /* Az akkumulátor kis pöcke a jobb szélén */
        .battery-container::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 4px;
            width: 1.5px;
            height: 4px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 0 1px 1px 0;
        }

        .battery-level {
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
        }

        /* ==========================================
           4. BLUETOOTH PLOCCSANÁS ANIMÁCIÓ (KAVICS A VÍZBEN)
           ========================================== */
        .ripple-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }

        /* Az animáció fázisai, amikor elindul */
        @keyframes ploccsanas {
            0% {
                width: 10px;
                height: 10px;
                opacity: 0.8;
                border-width: 3px;
            }
            50% {
                opacity: 0.4;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
                border-width: 1px;
            }
        }

        /* Ezt az osztályt kapja meg a ploccsanáskor */
        .active-ripple {
            animation: ploccsanas 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
    </style>
</head>
<body>

    <!-- A sziget maga -->
    <div class="trapez-island" id="dynamicIsland" onclick="tesztPloccsanas()">
        
        <!-- Bal oldal -->
        <div class="island-left">
            <span class="time-display" id="clock">00:00</span>
        </div>

        <!-- Közép -->
        <div class="island-center" id="islandContent">
            <!-- Alapból üres, ide ugranak be a hívások (Messenger/FaceTime) -->
        </div>

        <!-- Jobb oldal -->
        <div class="island-right">
            <span class="wifi-icon">📶</span>
            <div class="battery-container">
                <span class="battery-level" id="battery">88%</span>
            </div>
        </div>

        <!-- Vízfodrozódás effekt elem -->
        <div class="ripple-effect" id="islandRipple"></div>
    </div>

    <!-- ==========================================
       5. INTERAKTÍV MŰKÖDÉS (JAVASCRIPT)
       ========================================== -->
    <script>
        // --- ÓRA FRISSÍTÉSE ---
        // Ez a kis kód gondoskodik róla, hogy a szigeteden az idő mindig pontos legyen
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            
            // Ha a szám kisebb mint 10, elé rakunk egy nullát (pl: 09:05)
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            
            document.getElementById('clock').textContent = hours + ':' + minutes;
        }
        
        // Azonnal elindítjuk, és percenként frissítjük
        updateClock();
        setInterval(updateClock, 60000);


        // --- AKKUMULÁTOR FRISSÍTÉSE (XenHTML-hez igazítva) ---
        // Ha a telefonon fut, megpróbálja lekérni a valódi akksit a rendszertől
        if (navigator.getBattery) {
            navigator.getBattery().then(function(batteryObj) {
                function updateBatteryLevel() {
                    document.getElementById('battery').textContent = Math.floor(batteryObj.level * 100) + '%';
                }
                updateBatteryLevel();
                batteryObj.addEventListener('levelchange', updateBatteryLevel);
            });
        }


        // --- BLUETOOTH PLOCCSANÁS ANIMÁCIÓ UTASÍTÁS ---
        // Ezt a függvényt fogja meghívni a tweak, ha BT eszköz csatlakozik.
        // PC-s teszthez: HA RÁKATTINTASZ A SZIGETRE A BÖNGÉSZŐBEN, ELINDUL!
        function triggerBluetoothPloccsanas() {
            const ripple = document.getElementById('islandRipple');
            
            // Reseteljük az animációt, ha már futott volna
            ripple.classList.remove('active-ripple');
            void ripple.offsetWidth; // Trükk a böngésző újra-renderelésére
            
            // Elindítjuk a hullámot
            ripple.classList.add('active-ripple');
        }

        // Teszt funkció a PC-s kattintáshoz
        function tesztPloccsanas() {
            const content = document.getElementById('islandContent');
            content.style.color = "#00FFFF";
            content.textContent = "Bluetooth csatlakozva!";
            
            triggerBluetoothPloccsanas();
            
            // 3 másodperc múlva eltüntetjük a feliratot, hogy újra tiszta legyen a sziget
            setTimeout(() => {
                content.textContent = "";
            }, 3000);
        }
    </script>
</body>
</html>
